events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # ─── Patched static JS assets ─────────────────────────────────────
        # entrypoint.sh pre-fetches all JS bundles, rewrites the API URLs,
        # and saves them under /usr/share/nginx/html. Nginx serves those
        # patched files directly — no sub_filter, no gzip problem.
        # If a JS file wasn't pre-fetched (shouldn't happen), fall through
        # to the upstream proxy via @frontend.
        location ~* ^/assets/.*\.js$ {
            root /usr/share/nginx/html;
            try_files $uri @frontend;
            add_header Cache-Control "no-store" always;
        }

        # ─── Frontend proxy (os.agno.com) ────────────────────────────────
        # Handles HTML + all non-JS assets. sub_filter covers any remaining
        # API URL references in HTML/CSS (these are small and rarely gzipped).
        location / {
            proxy_pass https://os.agno.com;
            proxy_ssl_server_name on;

            proxy_set_header Host os.agno.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";

            proxy_redirect https://os.agno.com http://localhost:8080;
            proxy_cookie_domain os.agno.com localhost;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;

            add_header Cache-Control "no-store" always;

            # sub_filter still covers HTML — the JS is handled statically above
            sub_filter 'https://os-api.agno.com' 'http://localhost:8080/api-proxy';
            sub_filter 'https://os.agno.com' 'http://localhost:8080';
            sub_filter_once off;
            sub_filter_types *;
        }

        # Named fallback — identical to location / above, used by try_files
        location @frontend {
            proxy_pass https://os.agno.com;
            proxy_ssl_server_name on;

            proxy_set_header Host os.agno.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";

            proxy_redirect https://os.agno.com http://localhost:8080;
            proxy_cookie_domain os.agno.com localhost;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;

            sub_filter 'https://os-api.agno.com' 'http://localhost:8080/api-proxy';
            sub_filter 'https://os.agno.com' 'http://localhost:8080';
            sub_filter_once off;
            sub_filter_types *;
        }

        # ─── API Proxy (os-api.agno.com) ─────────────────────────────────
        location /api-proxy/ {
            rewrite ^/api-proxy/(.*) /$1 break;

            proxy_pass https://os-api.agno.com;
            proxy_ssl_server_name on;

            proxy_set_header Host os-api.agno.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Origin https://os.agno.com;
            proxy_set_header Referer https://os.agno.com/;
            proxy_set_header Accept-Encoding "";

            proxy_redirect https://os-api.agno.com http://localhost:8080/api-proxy;
            proxy_cookie_domain os-api.agno.com localhost;

            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;

            add_header 'Access-Control-Allow-Origin' 'http://localhost:8080' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;

            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' 'http://localhost:8080';
                add_header 'Access-Control-Allow-Credentials' 'true';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With';
                add_header 'Content-Length' '0';
                add_header 'Content-Type' 'text/plain';
                return 204;
            }

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }
    }
}
