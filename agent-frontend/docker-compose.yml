version: "3.8"

services:
  agno-proxy:
    build: .
    container_name: agno-proxy
    ports:
      - "8080:80"
    extra_hosts:
      # Lets the container reach your Mac's port 7777 via host.docker.internal.
      # This is automatic on Docker Desktop (Mac/Windows) but needed explicitly on Linux.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
